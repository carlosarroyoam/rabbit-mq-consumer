# Spring properties
spring.application.name=rabbit-mq-consumer

# Server properties
server.port=9090

# Logging
logging.level.root=INFO

# RabbitMQ properties
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=root
spring.rabbitmq.password=toor
spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.listener.simple.prefetch=20
spring.rabbitmq.listener.simple.concurrency=3
spring.rabbitmq.listener.simple.max-concurrency=10
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2.0

# App RabbitMQ properties
app.rabbitmq.message-exchange=message.exchange
app.rabbitmq.message-created-queue=message-created-queue
app.rabbitmq.message-created-routing-key=message.created.key
app.rabbitmq.message-dead-letter-exchange=message.dlx
app.rabbitmq.message-created-dead-letter-queue=message-created-queue.dlq
app.rabbitmq.message-created-dead-letter-routing-key=message.created.dlq.key
